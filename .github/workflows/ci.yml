name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: SQLite tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check server tests scripts --select E4,E7,E9,F --ignore E402,F401,F541,F821,F841,F811
      - run: python -m pytest tests -q -m "not integration and not ocr_integration"

  integration:
    name: PostgreSQL / Redis integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clauselight
          POSTGRES_USER: clauselight
          POSTGRES_PASSWORD: clauselight
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U clauselight -d clauselight"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: alembic upgrade head
        env:
          ENVIRONMENT: production
          DATABASE_URL: postgresql+asyncpg://clauselight:clauselight@localhost:5432/clauselight
          REDIS_URL: redis://localhost:6379/0
          REDIS_REQUIRED: "true"
          AUTH_PEPPER: ci-integration-pepper
      - run: python -m ruff check server tests scripts --select E4,E7,E9,F --ignore E402,F401,F541,F821,F841,F811
      - run: python -m pytest tests/v2 tests/integration -q -m "not ocr_integration"
        env:
          ENVIRONMENT: production
          DATABASE_URL: postgresql+asyncpg://clauselight:clauselight@localhost:5432/clauselight
          REDIS_URL: redis://localhost:6379/0
          REDIS_REQUIRED: "true"
          AUTH_PEPPER: ci-integration-pepper
          INTEGRATION_DATABASE_URL: postgresql+asyncpg://clauselight:clauselight@localhost:5432/clauselight
          INTEGRATION_REDIS_URL: redis://localhost:6379/0

  ocr-runtime:
    name: PaddleOCR real runtime
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/integration/test_ocr_runtime.py -q -m ocr_integration
