<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
                    
            <defs>
                <!-- Squircle App Icon Background -->
                <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#0A0F1C" />
                    <stop offset="100%" stop-color="#1A2235" />
                </linearGradient>

                <!-- Document Base Gradient -->
                <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FFFFFF" />
                    <stop offset="100%" stop-color="#E2E8F0" />
                </linearGradient>

                <!-- Soft Drop Shadow for Depth -->
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
                </filter>

                <!-- Radiant Glows for Traffic Lights -->
                <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="8" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
                <filter id="glowYellow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="8" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
                <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="8" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
                
                <!-- Scanner Laser Effects -->
                <filter id="glowLaser" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="6" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
                <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
                    <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.25"/>
                </linearGradient>
            </defs>
        
                    <!-- Transparent Base (No rect) -->
                    
            <!-- Document Shape -->
            <g filter="url(#shadow)">
                <!-- Main Paper -->
                <path d="M146 96 h160 l60 60 v244 a20 20 0 0 1 -20 20 h-200 a20 20 0 0 1 -20 -20 v-284 a20 20 0 0 1 20 -20 z" fill="url(#paperGrad)" />
                <!-- Folded Corner -->
                <path d="M306 96 v44 a16 16 0 0 0 16 16 h44 z" fill="#CBD5E1" />
            </g>

            <!-- Unscanned clauses (Bottom) - Gray -->
            <rect x="176" y="380" width="150" height="16" rx="8" fill="#CBD5E1" />
            <rect x="176" y="420" width="100" height="16" rx="8" fill="#CBD5E1" />

            <!-- The Scanner Beam Overlay -->
            <path d="M126 96 L386 96 L406 350 L106 350 Z" fill="url(#laserGrad)" style="mix-blend-mode: screen;" pointer-events="none" />
            
            <!-- Laser Line -->
            <line x1="90" y1="350" x2="422" y2="350" stroke="#60A5FA" stroke-width="4" filter="url(#glowLaser)"/>
            <line x1="90" y1="350" x2="422" y2="350" stroke="#FFFFFF" stroke-width="2"/>

            <!-- Scanned clauses (Top) - Traffic Lights -->
            
            <!-- Red Risk Clause -->
            <circle cx="186" cy="168" r="14" fill="#EF4444" filter="url(#glowRed)" />
            <rect x="220" y="160" width="106" height="16" rx="8" fill="#FCA5A5" />

            <!-- Yellow Warning Clause -->
            <circle cx="186" cy="228" r="14" fill="#F59E0B" filter="url(#glowYellow)" />
            <rect x="220" y="220" width="126" height="16" rx="8" fill="#FDE047" />

            <!-- Green Safe Clause -->
            <circle cx="186" cy="288" r="14" fill="#10B981" filter="url(#glowGreen)" />
            <rect x="220" y="280" width="86" height="16" rx="8" fill="#6EE7B7" />
        
                </svg>