[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=server --cov-report=term-missing --cov-report=html
markers =
    integration: requires external PostgreSQL or Redis services
    ocr_integration: requires the installed PaddleOCR runtime and models
